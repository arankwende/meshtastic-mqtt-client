name: Meshtastic Bridge
version: "2.0.0"
slug: meshtastic_bridge
description: Meshtastic sensors in Home Assistant, alerts to the mesh, and Assist chat over LoRa.
url: https://github.com/arankwende/meshtastic-mqtt-client
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
services:
  - mqtt:want
map:
  - type: app_config
    read_only: false
options:
  debug: false
schema:
  debug: bool
